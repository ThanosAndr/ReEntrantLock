name: Multiple Platform Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cpp_compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cpp_compiler: cl
          - os: ubuntu-latest
            cpp_compiler: g++
          - os: ubuntu-latest
            cpp_compiler: clang++

    env:
      BUILD_TYPE: Release

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -S .

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test
      run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

  thread-sanitizer:
    name: ubuntu-latest / clang++ / ThreadSanitizer
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Newer kernels use more ASLR entropy than older TSan runtimes support.
    - name: Reduce ASLR entropy for TSan
      run: sudo sysctl vm.mmap_rnd_bits=28

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS="-fsanitize=thread -g"
        -S .

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      env:
        TSAN_OPTIONS: halt_on_error=1
      run: ctest --test-dir build --output-on-failure
